{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}

<div style="max-width:440px">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
    <a href="/acts" style="color:#94a3b8;text-decoration:none;font-size:13px">← Акти</a>
    <span style="color:#e2e8f0">/</span>
    <h1 style="font-size:18px;font-weight:700;color:#0f172a;margin:0">{{ title }}</h1>
  </div>

  <div class="card" style="margin-bottom:12px;padding:12px 16px;background:#fefce8;border-color:#fde68a">
    <div style="font-size:13px;color:#92400e">
      <strong>{{ act.act_no }}</strong> — {{ act.client_name }}<br>
      <span style="color:#78350f;font-size:12px">Рахунок: {{ act.invoice_no or '—' }}</span>
    </div>
  </div>

  <div class="card">
    <form method="post" action="/acts/{{ act.act_no }}/edit"
          style="display:flex;flex-direction:column;gap:14px">

      <div class="field" style="width:180px">
        <label>Дата акту</label>
        <input type="text" name="act_date" value="{{ act.act_date or '' }}" placeholder="дд.мм.рррр"/>
      </div>

      <div class="field" style="width:200px">
        <label>Статус</label>
        <select name="status">
          <option value="Чернетка"    {% if act.status == 'Чернетка'    %}selected{% endif %}>📝 Чернетка</option>
          <option value="Направлений" {% if act.status == 'Направлений' %}selected{% endif %}>⚠️ Направлений</option>
          <option value="Підписано"   {% if act.status == 'Підписано'   %}selected{% endif %}>✓ Підписано</option>
          <option value="Скасовано"   {% if act.status == 'Скасовано'   %}selected{% endif %}>Скасовано</option>
        </select>
      </div>

      <div style="display:flex;gap:10px;padding-top:4px">
        <button type="submit" class="btn btn-primary">💾 Зберегти</button>
        <a href="/acts" class="btn btn-ghost">Скасувати</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
