{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}

<div style="max-width:520px">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
    <a href="/invoices" style="color:#94a3b8;text-decoration:none;font-size:13px">← Рахунки</a>
    <span style="color:#e2e8f0">/</span>
    <h1 style="font-size:18px;font-weight:700;color:#0f172a;margin:0">{{ title }}</h1>
  </div>

  <div class="card" style="margin-bottom:12px;padding:12px 16px;background:#fefce8;border-color:#fde68a">
    <div style="font-size:13px;color:#92400e">
      <strong>{{ inv.invoice_no }}</strong> — {{ inv.client_name }}<br>
      <span style="color:#78350f;font-size:12px">Договір: {{ inv.contract_no or '—' }}</span>
    </div>
  </div>

  <div class="card">
    <form method="post" action="/invoices/{{ inv.invoice_no }}/edit"
          style="display:flex;flex-direction:column;gap:14px">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field">
          <label>Дата рахунку</label>
          <input type="text" name="invoice_date" value="{{ inv.invoice_date or '' }}" placeholder="дд.мм.рррр"/>
        </div>
        <div class="field">
          <label>Курс (USD/EUR)</label>
          <input type="number" step="0.01" name="fx_rate" value="{{ inv.fx_rate or 0 }}"/>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field">
          <label>Період з</label>
          <input type="text" name="period_from" value="{{ inv.period_from or '' }}" placeholder="дд.мм.рррр"/>
        </div>
        <div class="field">
          <label>Період по</label>
          <input type="text" name="period_to" value="{{ inv.period_to or '' }}" placeholder="дд.мм.рррр"/>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field">
          <label>Сума, грн *</label>
          <input type="number" step="0.01" name="sum_uah" value="{{ inv.sum_uah or 0 }}" required
                 style="font-weight:700;font-size:14px"/>
        </div>
        <div class="field">
          <label>Знижка, %</label>
          <input type="number" step="0.01" name="discount_pct" value="{{ inv.discount_pct or 0 }}" min="0" max="100"/>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field">
          <label>Статус оплати</label>
          <select name="pay_status">
            {% for s in ['Не оплачено','Оплачено','Скасовано'] %}
            <option value="{{ s }}" {% if inv.pay_status == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field">
          <label>Дата оплати</label>
          <input type="text" name="pay_date" value="{{ inv.pay_date or '' }}" placeholder="дд.мм.рррр"/>
        </div>
      </div>

      <div style="display:flex;gap:10px;padding-top:4px">
        <button type="submit" class="btn btn-primary">💾 Зберегти</button>
        <a href="/invoices" class="btn btn-ghost">Скасувати</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
